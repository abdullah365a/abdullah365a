<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم لدن</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--w:#5e1a2c;--c:#fbefe6;--p:#fff8f2;--s:#a9b79b;--l:#ecd9cf;--t:#2b1219;--m:#7d6169}
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;background:var(--c);color:var(--t);padding-bottom:60px;line-height:1.7;max-width:760px;margin-inline:auto}
header{background:var(--w);color:var(--c);padding:18px 16px;border-radius:0 0 22px 22px}
header h1{font-size:22px;font-weight:800}header p{opacity:.85;font-size:13px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;position:sticky;top:0;background:var(--c);z-index:5;border-bottom:1px solid var(--l)}
button,.btn{font:700 14px "Noto Kufi Arabic",sans-serif;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--w);color:var(--c);min-height:42px}
.g{background:var(--p);color:var(--w);box-shadow:inset 0 0 0 1.5px var(--w)}
.d{background:#b3261e}
.hint{margin:12px 16px;padding:12px;background:var(--p);border:1px solid var(--l);border-radius:12px;font-size:13px;color:var(--m)}
h2{font-size:19px;color:var(--w);margin:20px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.it{background:var(--p);border:1px solid var(--l);border-radius:14px;margin:0 16px 12px;padding:12px}
label{display:block;font-size:12px;color:var(--m);margin-top:8px}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--l);border-radius:10px;padding:9px;font:14px "Noto Kufi Arabic",sans-serif;background:#fff;color:var(--t)}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}
.row input[type=number]{max-width:130px}
.im{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.im div{position:relative}.im img{width:72px;height:72px;object-fit:cover;border-radius:10px;display:block}
.im button{position:absolute;top:2px;inset-inline-start:2px;padding:0;width:24px;min-height:24px;border-radius:50%;background:#b3261e;font-size:14px}
.sm{padding:6px 10px;min-height:34px;font-size:13px}
#msg{font-size:13px;color:var(--m);padding:0 16px}
</style>
</head>
<body>
<header><h1>لوحة تحكم لدن بيكري</h1><p>أضف صنف، غيّر سعر، أو احذف، ثم نزّل الملف الجديد</p></header>
<div class="bar">
  <button id="dl">تنزيل menu.json</button>
  <label class="btn g" style="margin:0;color:var(--w)">رفع menu.json<input id="up" type="file" accept=".json" hidden></label>
  <button class="g" id="rs">إعادة التحميل من الموقع</button>
</div>
<div class="hint">بعد ما تخلص: اضغط "تنزيل menu.json"، وضعه مكان الملف القديم في مجلد الموقع، وارفع المجلد على Netlify. التعديلات تنحفظ تلقائياً في هذا المتصفح لين تنزّل الملف. سعر فاضي يعني "السعر عند الطلب".</div>
<div id="msg"></div>
<main id="app"></main>
<script>
var M=[],CATS={cookies:'الكوكيز',sweets:'بودينق وسخان',cakes:'الكيكات',others:'حلويات أخرى'};
function $(i){return document.getElementById(i)}
function save(){try{localStorage.setItem('laden_menu',JSON.stringify(M))}catch(e){}}
function say(t){$('msg').textContent=t}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function render(){
  var h='';
  for(var c in CATS){
    h+='<h2>'+CATS[c]+'<button class="sm" data-act="add" data-c="'+c+'">+ صنف جديد</button></h2>';
    M.forEach(function(it,i){
      if(it.c!==c)return;
      h+='<div class="it"><label>الاسم</label><input type="text" data-f="n" data-i="'+i+'" value="'+esc(it.n)+'">'
      +'<label>وصف قصير (مثل: ٦٠ جرام)</label><input type="text" data-f="t" data-i="'+i+'" value="'+esc(it.t)+'">'
      +'<label>الوصف</label><textarea rows="2" data-f="d" data-i="'+i+'">'+esc(it.d)+'</textarea>'
      +'<label>القسم</label><select data-f="c" data-i="'+i+'">'+Object.keys(CATS).map(function(k){return'<option value="'+k+'"'+(k===it.c?' selected':'')+'>'+CATS[k]+'</option>'}).join('')+'</select>'
      +'<label>الخيارات والأسعار</label>';
      it.o.forEach(function(o,j){
        h+='<div class="row"><input type="text" data-o="l" data-i="'+i+'" data-j="'+j+'" value="'+esc(o.l)+'" placeholder="الخيار (مثل: بوكس ١٢ حبة)"><input type="number" min="0" data-o="p" data-i="'+i+'" data-j="'+j+'" value="'+(o.p==null?'':o.p)+'" placeholder="السعر"><button class="sm d" data-act="delo" data-i="'+i+'" data-j="'+j+'">×</button></div>';
      });
      h+='<div class="row"><button class="sm g" data-act="addo" data-i="'+i+'">+ خيار وسعر</button></div>'
      +'<label class="row" style="color:var(--t)"><input type="checkbox" data-w="1" data-i="'+i+'"'+(it.w?' checked':'')+'> يقبل كتابة على الكيكة (+٣ ريال)</label>'
      +'<label>الصور (الأولى تظهر في المنيو)</label><div class="im">'
      +it.i.map(function(s,k){return'<div><img src="'+s+'" alt=""><button data-act="deli" data-i="'+i+'" data-k="'+k+'" aria-label="حذف الصورة">×</button></div>'}).join('')
      +'</div><div class="row"><label class="btn g sm" style="margin:0;color:var(--w)">+ صورة<input type="file" accept="image/*" multiple hidden data-img="'+i+'"></label><button class="sm d" data-act="deli_all" data-i="'+i+'" style="margin-inline-start:auto">حذف الصنف</button></div></div>';
    });
  }
  $('app').innerHTML=h;
}
function comp(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(480,im.width),hh=im.height*w/im.width,cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(im,0,0,w,hh);cb(cv.toDataURL('image/webp',.8))};im.src=r.result};r.readAsDataURL(f)}
document.addEventListener('input',function(e){
  var t=e.target,i=t.dataset.i;if(i==null)return;
  if(t.dataset.f&&t.tagName!=='SELECT')M[i][t.dataset.f]=t.value;
  else if(t.dataset.o){var o=M[i].o[t.dataset.j];if(t.dataset.o==='l')o.l=t.value;else o.p=t.value===''?null:Number(t.value)}
  save();
});
document.addEventListener('change',function(e){
  var t=e.target,i=t.dataset.i;
  if(t.dataset.f==='c'){M[i].c=t.value;save();render();return}
  if(t.dataset.w){if(t.checked)M[i].w=3;else delete M[i].w;save();return}
  if(t.dataset.img!=null){var n=Number(t.dataset.img),fs=Array.prototype.slice.call(t.files),left=fs.length;fs.forEach(function(f){comp(f,function(d){M[n].i.push(d);if(!--left){save();render()}})})}
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,i=b.dataset.i;
  if(a==='add'){M.push({c:b.dataset.c,n:'صنف جديد',t:'',d:'',i:[],o:[{l:'السعر',p:null}]});save();render();window.scrollTo(0,document.body.scrollHeight)}
  if(a==='addo'){M[i].o.push({l:'',p:null});save();render()}
  if(a==='delo'){if(M[i].o.length>1){M[i].o.splice(b.dataset.j,1);save();render()}}
  if(a==='deli'){M[i].i.splice(b.dataset.k,1);save();render()}
  if(a==='deli_all'){if(confirm('حذف الصنف "'+M[i].n+'" نهائياً؟')){M.splice(i,1);save();render()}}
});
$('dl').onclick=function(){
  var bad=M.filter(function(it){return !it.n||!it.i.length});
  if(bad.length&&!confirm('فيه '+bad.length+' صنف بدون اسم أو بدون صورة. تبي تنزّل الملف؟'))return;
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({items:M})],{type:'application/json'}));a.download='menu.json';a.click();say('نزّل الملف. استبدله في مجلد الموقع وارفع المجلد على Netlify.')};
$('up').onchange=function(e){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);M=d.items||d;save();render();say('تم تحميل الملف.')}catch(x){say('الملف غير صالح.')}};r.readAsText(e.target.files[0])};
function fromSite(){fetch('menu.json').then(function(r){return r.json()}).then(function(d){M=d.items;save();render();say('تم التحميل من الموقع.')}).catch(function(){say('ما قدرت أقرأ menu.json من الموقع. استخدم زر "رفع menu.json".')})}
$('rs').onclick=function(){if(confirm('تنحذف تعديلاتك غير المنزّلة. تكمل؟'))fromSite()};
var s=null;try{s=localStorage.getItem('laden_menu')}catch(x){}
if(s){M=JSON.parse(s);render()}else fromSite();
</script>
</body>
</html>
